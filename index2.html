<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiS</title>
    <link rel="shortcut icon" href="./icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== CSS 变量 (主题) ===== */
        :root {
            /* 深色主题 (默认) */
            --bg-primary: radial-gradient(ellipse at 20% 50%, #0b1120 0%, #0f1a2f 70%, #162033 100%);
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.04);
            --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.6);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: rgba(148, 163, 184, 0.5);
            --icon-bg: rgba(255, 255, 255, 0.04);
            --icon-color: #a5b4fc;
            --hover-bg: rgba(255, 255, 255, 0.07);
            --hover-border: rgba(255, 255, 255, 0.10);
            --glow-color: rgba(99, 102, 241, 0.15);
            --footer-border: rgba(255, 255, 255, 0.02);
            --toggle-bg: rgba(255, 255, 255, 0.06);
            --toggle-icon: #fbbf24;
            --toggle-hover: rgba(255, 255, 255, 0.12);
        }

        /* 浅色主题 */
        body.light {
            --bg-primary: radial-gradient(ellipse at 20% 50%, #f0f4ff 0%, #e8edf9 70%, #dce3f0 100%);
            --bg-card: rgba(255, 255, 255, 0.50);
            --border-card: rgba(255, 255, 255, 0.70);
            --shadow-card: 0 30px 60px rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: rgba(71, 85, 105, 0.5);
            --icon-bg: rgba(99, 102, 241, 0.08);
            --icon-color: #4f46e5;
            --hover-bg: rgba(255, 255, 255, 0.80);
            --hover-border: rgba(148, 163, 184, 0.30);
            --glow-color: rgba(99, 102, 241, 0.10);
            --footer-border: rgba(148, 163, 184, 0.15);
            --toggle-bg: rgba(30, 41, 59, 0.08);
            --toggle-icon: #f59e0b;
            --toggle-hover: rgba(30, 41, 59, 0.15);
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* 背景光晕 (深色/浅色自适应) */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60vmax;
            height: 60vmax;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
        }

        body.light::after {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, transparent 70%);
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 3.5rem;
            padding: 3rem 3rem 3.5rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-card);
            transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        /* ===== 标题区域 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.8rem;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
        }

        .title-group {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
        }

        .title-icon {
            font-size: 2.4rem;
            color: var(--icon-color);
            filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.2));
            transition: color 0.3s ease;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: color 0.3s ease;
            line-height: 1.2;
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            background: var(--toggle-bg);
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--border-card);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .theme-toggle:hover {
            background: var(--toggle-hover);
            transform: scale(1.03);
        }

        .theme-toggle i {
            font-size: 1.1rem;
            color: var(--toggle-icon);
            transition: transform 0.5s ease;
        }

        .theme-toggle .toggle-label {
            font-size: 0.7rem;
            letter-spacing: 0.3px;
        }

        /* ===== 工具网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        /* ===== 卡片按钮 ===== */
        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.8rem 1.2rem 1.6rem;
            background: var(--bg-card);
            border-radius: 1.8rem;
            border: 1px solid var(--border-card);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            min-height: 120px;
            border-color: var(--border-card);
            background: var(--bg-card);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s, color 0.3s;
        }

        /* 卡片光晕 (hover) */
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 1.8rem;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.1), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        body.light .tool-card::before {
            background: radial-gradient(circle at 30% 20%, rgba(239, 239, 239, 0.6), transparent 70%);
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        /* 彩色光晕跟随鼠标 */
        .tool-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.06), transparent 60%);
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        body.light .tool-card::after {
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.08), transparent 60%);
        }

        .tool-card:hover::after {
            opacity: 1;
        }

        .tool-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: var(--hover-bg);
            border-color: var(--hover-border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
        }

        body.light .tool-card:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06);
        }

        .tool-card:active {
            transform: scale(0.96) translateY(0);
            transition-duration: 0.08s;
        }

        /* 卡片图标 */
        .tool-card .icon {
            font-size: 2rem;
            margin-bottom: 0.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.6rem;
            height: 3.6rem;
            border-radius: 1.2rem;
            background: var(--icon-bg);
            color: var(--icon-color);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .tool-card:hover .icon {
            background: var(--icon-bg);
            color: var(--icon-color);
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        body.light .tool-card:hover .icon {
            filter: brightness(0.9);
        }

        /* 卡片文字 */
        .tool-card .label {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.01em;
            transition: color 0.3s ease;
            line-height: 1.3;
        }

        .tool-card .sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 0.2rem;
            letter-spacing: 0.02em;
            transition: color 0.3s;
        }

        /* ===== 不同卡片的个性颜色 (icon 背景) ===== */
        .tool-card[data-color="purple"] .icon {
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
        }
        body.light .tool-card[data-color="purple"] .icon {
            background: rgba(99, 102, 241, 0.10);
            color: #4f46e5;
        }

        .tool-card[data-color="pink"] .icon {
            background: rgba(236, 72, 153, 0.12);
            color: #f472b6;
        }
        body.light .tool-card[data-color="pink"] .icon {
            background: rgba(236, 72, 153, 0.10);
            color: #db2777;
        }

        .tool-card[data-color="cyan"] .icon {
            background: rgba(34, 211, 238, 0.10);
            color: #67e8f9;
        }
        body.light .tool-card[data-color="cyan"] .icon {
            background: rgba(34, 211, 238, 0.10);
            color: #0891b2;
        }

        .tool-card[data-color="emerald"] .icon {
            background: rgba(52, 211, 153, 0.10);
            color: #6ee7b7;
        }
        body.light .tool-card[data-color="emerald"] .icon {
            background: rgba(52, 211, 153, 0.10);
            color: #059669;
        }

        .tool-card[data-color="amber"] .icon {
            background: rgba(251, 191, 36, 0.10);
            color: #fcd34d;
        }
        body.light .tool-card[data-color="amber"] .icon {
            background: rgba(251, 191, 36, 0.10);
            color: #b45309;
        }

        .tool-card[data-color="rose"] .icon {
            background: rgba(244, 63, 94, 0.10);
            color: #fb7185;
        }
        body.light .tool-card[data-color="rose"] .icon {
            background: rgba(244, 63, 94, 0.10);
            color: #be123c;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 2.8rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            font-weight: 400;
            border-top: 1px solid var(--footer-border);
            padding-top: 2rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .footer-note span {
            display: inline-block;
            margin: 0 0.6rem;
            opacity: 0.4;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .container {
                padding: 2.2rem 1.5rem 2.8rem;
                border-radius: 2.4rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .title-icon {
                font-size: 1.8rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.9rem;
            }
            .tool-card {
                min-height: 100px;
                padding: 1.4rem 0.8rem 1.2rem;
                border-radius: 1.4rem;
            }
            .tool-card .icon {
                width: 2.8rem;
                height: 2.8rem;
                font-size: 1.5rem;
                border-radius: 1rem;
            }
            .tool-card .label {
                font-size: 0.85rem;
            }
            .tool-card .sub {
                font-size: 0.6rem;
            }
            .theme-toggle .toggle-label {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.8rem 1.2rem 2.2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.7rem;
            }
            .tool-card {
                min-height: 80px;
                padding: 1rem 0.4rem 0.9rem;
                border-radius: 1.2rem;
            }
            .tool-card .icon {
                width: 2.4rem;
                height: 2.4rem;
                font-size: 1.2rem;
                border-radius: 0.8rem;
                margin-bottom: 0.3rem;
            }
            .tool-card .label {
                font-size: 0.75rem;
            }
            .tool-card .sub {
                display: none;
            }
            .header {
                margin-bottom: 2rem;
            }
            .theme-toggle {
                padding: 0.4rem 0.7rem;
            }
            .theme-toggle .toggle-label {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 0.7rem;
            }
            .tool-card {
                min-height: 70px;
                flex-direction: row;
                gap: 1rem;
                padding: 0.8rem 1.2rem;
                justify-content: flex-start;
            }
            .tool-card .icon {
                width: 2.4rem;
                height: 2.4rem;
                font-size: 1.1rem;
                margin-bottom: 0;
            }
            .tool-card .label {
                font-size: 0.85rem;
            }
            .tool-card .sub {
                display: none;
            }
        }

        /* ===== 鼠标跟随变量 ===== */
        .tool-card {
            --x: 50%;
            --y: 50%;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 标题栏 + 主题切换 -->
        <div class="header">
            <div class="title-group">
                <span class="title-icon"><i class="fas fa-cube"></i></span>
                <h1>some tools</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <i class="fas fa-moon" id="themeIcon"></i>
                    <span class="toggle-label" id="themeLabel">深色</span>
                </button>
            </div>
        </div>

        <!-- 工具网格 -->
        <div class="grid">

            <div class="tool-card" data-color="purple" onclick="location.href='./ks_scanner.html'">
                <span class="icon"><i class="fas fa-qrcode"></i></span>
                <span class="label">QR Scanner</span>
                <span class="sub">KIS扫码识别</span>
            </div>

            <div class="tool-card" data-color="pink" onclick="location.href='./ks_otp.html'">
                <span class="icon"><i class="fas fa-key"></i></span>
                <span class="label">One-Time Password</span>
                <span class="sub">一次性通行证</span>
            </div>

            <div class="tool-card" data-color="cyan" onclick="location.href='./ks_otp.html?e=1'">
                <span class="icon"><i class="fas fa-user-shield"></i></span>
                <span class="label">OTP with User</span>
                <span class="sub">一次性用户密码</span>
            </div>

            <div class="tool-card" data-color="emerald" onclick="location.href='./imagexpo.html'">
                <span class="icon"><i class="fas fa-images"></i></span>
                <span class="label">imagExpo</span>
                <span class="sub">图展</span>
            </div>

            <div class="tool-card" data-color="amber" onclick="location.href='./photo_statistics.html'">
                <span class="icon"><i class="fas fa-chart-pie"></i></span>
                <span class="label">Photo Stats</span>
                <span class="sub">照片统计</span>
            </div>

            <div class="tool-card" data-color="rose" onclick="window.open('https://weioua.github.io/webnote/', '_blank')">
                <span class="icon"><i class="fas fa-pen-fancy"></i></span>
                <span class="label">webnote</span>
                <span class="sub">在线笔记</span>
            </div>

        </div>

        <!-- 底部 -->
        <div class="footer-note">
            <span>-</span> KiS · 2.0<span>-</span>
        </div>

    </div>

    <script>
        (function() {
            // ---------- 主题切换 ----------
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const body = document.body;

            // 检测存储的主题
            const storedTheme = localStorage.getItem('kis-theme');
            if (storedTheme === 'dark') {
                body.classList.remove('light');
                icon.className = 'fas fa-sun';
                label.textContent = '浅色';
            } else {
                body.classList.add('light');
                icon.className = 'fas fa-moon';
                label.textContent = '深色';
            }

            toggleBtn.addEventListener('click', function() {
                const isLight = body.classList.toggle('light');
                if (isLight) {
                    icon.className = 'fas fa-moon';
                    label.textContent = '深色';
                    localStorage.setItem('kis-theme', 'light');
                } else {
                    icon.className = 'fas fa-sun';
                    label.textContent = '浅色';
                    localStorage.setItem('kis-theme', 'dark');
                }
            });

            // ---------- 鼠标跟随光晕 (卡片) ----------
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    card.style.setProperty('--x', x + '%');
                    card.style.setProperty('--y', y + '%');
                });

                card.addEventListener('mouseleave', () => {
                    card.style.setProperty('--x', '50%');
                    card.style.setProperty('--y', '50%');
                });
            });

        })();
    </script>

</body>
</html>
